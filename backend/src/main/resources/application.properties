# Server Configuration
server.port=8080

# Application Name
spring.application.name=voltnav-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/voltnav_db
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Security Configuration
voltnav.jwt.secret=9a6747f3a8b2c4d6e8f0123456789abcde0123456789abcdef0123456789abcd
voltnav.jwt.expiration-ms=86400000

# Springdoc OpenAPI (Swagger UI) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.voltnav=INFO
logging.level.org.springframework.web=INFO
